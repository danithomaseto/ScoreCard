<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Score Card - Automacao</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>Montagem do Score Card</h1>
    <p class="subtitle">Selecione a operacao para iniciar a extracao.</p>

    <label for="operation">Operacao</label>
    <select id="operation">
      {% for key, op in operations.items() %}
        <option value="{{ key }}">{{ op.label }}</option>
      {% endfor %}
    </select>

    <button id="run-btn">Executar login</button>

    <div id="status" class="status" hidden></div>
  </main>

  <script>
    const runBtn = document.getElementById('run-btn');
    const statusBox = document.getElementById('status');
    const operationSelect = document.getElementById('operation');

    runBtn.addEventListener('click', async () => {
      const operation = operationSelect.value;
      runBtn.disabled = true;
      runBtn.textContent = 'Executando...';
      statusBox.hidden = false;
      statusBox.className = 'status';
      statusBox.textContent = 'Conectando na operacao selecionada...';

      try {
        const response = await fetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ operation }),
        });
        const result = await response.json();

        statusBox.className = 'status ' + (result.success ? 'success' : 'error');
        statusBox.textContent = result.message || 'Sem retorno da automacao.';
      } catch (err) {
        statusBox.className = 'status error';
        statusBox.textContent = 'Falha ao chamar a automacao: ' + err.message;
      } finally {
        runBtn.disabled = false;
        runBtn.textContent = 'Executar login';
      }
    });
  </script>
</body>
</html>
