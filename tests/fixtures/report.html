<!doctype html><html><body>
<h1>Raw Summary Report</h1>

<label><input type="radio" name="dateRangeMode" id="defaultdaterange_radio-inputEl" checked onclick="toggleMode()"> Default Date Range</label>
<label><input type="radio" name="dateRangeMode" id="customdaterange_radio-inputEl" onclick="toggleMode()"> Custom Date Range</label>

<div id="defaultBlock">
  <label for="dateRange">Date Range</label>
  <input id="dateRange" role="combobox" aria-label="Date Range" value="This Week">
  <div id="dateRangeOptions"></div>
</div>

<div id="customBlock" style="display:none;">
  <div>
    <span>From Date</span>
    <input id="datefield-1138-inputEl" type="text" value="15/09/2026">
    <input id="timefield-1139-inputEl" type="text" value="18:39:50">
  </div>
  <div>
    <span>To Date</span>
    <input id="datefield-1142-inputEl" type="text" value="15/09/2026">
    <input id="timefield-1143-inputEl" type="text" value="18:39:50">
  </div>
</div>

<label for="groupBy">Group By 1*</label>
<input id="groupBy" role="combobox" aria-label="Group By 1*" value="Shift">
<div id="groupByOptions"></div>

<!-- Segundo nivel: o Group By 2 so fica utilizavel com o checkbox
     marcado, igual ao Summary. O checkbox guarda estado, entao um
     clique cego no que ja esta marcado desmarca. -->
<label><input type="checkbox" id="groupinglvl2_check-inputEl" onclick="toggleLevel2()"> Group By 2</label>
<label for="groupBy2">Group By 2</label>
<input id="groupBy2" role="combobox" aria-label="Group By 2" value="" disabled>
<div id="groupBy2Options"></div>

<!-- Terceiro nivel: mesmo esquema do segundo. -->
<label><input type="checkbox" id="groupinglvl3_check-inputEl" onclick="toggleLevel3()"> Group By 3</label>
<label for="groupBy3">Group By 3</label>
<input id="groupBy3" role="combobox" aria-label="Group By 3" value="" disabled>
<div id="groupBy3Options"></div>

<script>
const GROUP_BY_OPTIONS = [
  "Aisle Area","Aisle Area Desc.","Client","Customer","Fiscal Month","Fiscal Week",
  "Job Code","Job Code Desc.","Learning Curve","Month","Observation State",
  "Reference ID","Report By Hour","Report Date","Report Group","Route Number",
  "Shift","Shift Category","Supervisor","User","User Group","User ID","User Name",
  "User Pin","Warehouse","Week","Work Area","Work Category","Work Team"
];

const DATE_RANGE_OPTIONS = ["Last Month", "Last Week", "Last Year", "This Month", "This Week"];

function ligarCombo(inputId, boxId, opcoes) {
  document.getElementById(inputId).addEventListener('keyup', function() {
    const v = this.value;
    const box = document.getElementById(boxId);
    box.innerHTML = '';
    if (!v) return;
    const matches = opcoes.filter(o => o.toLowerCase().startsWith(v.toLowerCase()));
    for (const match of matches) {
      const opt = document.createElement('div');
      opt.setAttribute('role', 'option');
      opt.textContent = match;
      opt.onclick = function() {
        document.getElementById(inputId).value = match;
        box.innerHTML = '';
      };
      box.appendChild(opt);
    }
  });
}

ligarCombo('groupBy', 'groupByOptions', GROUP_BY_OPTIONS);
ligarCombo('groupBy2', 'groupBy2Options', GROUP_BY_OPTIONS);
ligarCombo('groupBy3', 'groupBy3Options', GROUP_BY_OPTIONS);
ligarCombo('dateRange', 'dateRangeOptions', DATE_RANGE_OPTIONS);

function toggleLevel2() {
  const ligado = document.getElementById('groupinglvl2_check-inputEl').checked;
  const campo = document.getElementById('groupBy2');
  campo.disabled = !ligado;
  if (!ligado) campo.value = '';
}

function toggleLevel3() {
  const ligado = document.getElementById('groupinglvl3_check-inputEl').checked;
  const campo = document.getElementById('groupBy3');
  campo.disabled = !ligado;
  if (!ligado) campo.value = '';
}

function toggleMode() {
  const custom = document.getElementById('customdaterange_radio-inputEl').checked;
  document.getElementById('customBlock').style.display = custom ? 'block' : 'none';
  document.getElementById('defaultBlock').style.display = custom ? 'none' : 'block';
}
</script>

<button id="button-1128" onclick="document.getElementById('exportModal').style.display='block';">Export</button>

<div id="exportModal" style="display:none;">
  <label><input type="radio" name="fmt" id="excelRadio"> EXCEL</label>
  <button id="button-1224">Ok</button>
</div>

<a id="downloadLink" href="summary_3semanas.xlsx" download="RawSummaryReport.xlsx" style="display:none;"></a>
<script>
document.getElementById('button-1224').addEventListener('click', function() {
  // O arquivo entregue muda com o agrupamento, igual ao Summary:
  //   Week > Supervisor (ou Shift) > User ID   export semanal por gestor/turno
  //   Week > Job Code                          horas indiretas, por atividade
  //   Week > User ID                           semanal sem o gestor
  //   Supervisor (ou Shift) > User ID          mes por gestor/turno
  //   Report Date                              dias de pico, uma linha por dia
  //   User ID                                  mes consolidado, sem data
  const nivel2 = document.getElementById('groupinglvl2_check-inputEl').checked;
  const nivel3 = nivel2 && document.getElementById('groupinglvl3_check-inputEl').checked;
  const g1 = document.getElementById('groupBy').value;
  const g2 = document.getElementById('groupBy2').value;
  const link = document.getElementById('downloadLink');
  const turno = (g1 === 'Shift' || g2 === 'Shift');
  if (nivel3) link.href = turno ? 'summary_turno_semana.xlsx' : 'summary_gestor_semana.xlsx';
  else if (nivel2 && g2 === 'Job Code') link.href = 'summary_indiretas.xls';
  else if (nivel2 && g1 === 'Week') link.href = 'summary_3semanas.xlsx';
  else if (nivel2) link.href = turno ? 'summary_turno_mes.xlsx' : 'summary_gestor_mes.xlsx';
  else link.href = g1 === 'Report Date' ? 'summary_pico.xlsx' : 'summary_mes.xlsx';
  link.click();
});
</script>
</body></html>
