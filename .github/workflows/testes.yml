# Roda a cada push e pull request: os testes (com a automacao de verdade
# contra as paginas de mock do Summary em tests/fixtures), e uma checagem
# de erros de codigo no Python e no JavaScript da tela.
#
# O app e de Windows, mas o que e testado aqui (leitura dos relatorios,
# calculo, pasta compartilhada, automacao no Chromium) roda igual no Linux.
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt flake8==7.1.1
          python -m playwright install --with-deps chromium

      - name: Python - nomes errados, imports sobrando (flake8, so erros)
        run: python -m flake8 --select=F --exclude=venv,build,dist,__pycache__ .

      - name: JavaScript - variavel ou funcao que nao existe (eslint)
        # Os arquivos de ui/js dividem o mesmo escopo no navegador: a
        # checagem roda nos doze juntos, na ordem do index.html.
        run: |
          cat ui/js/*.js > "$RUNNER_TEMP/ui.js"
          npx --yes eslint@8.57.0 --no-eslintrc --env browser,es2022 \
            --parser-options=ecmaVersion:2022 \
            --rule '{"no-undef":"error","no-redeclare":"error"}' \
            --global pywebview "$RUNNER_TEMP/ui.js"

      - name: Testes
        run: python -m pytest -q tests
