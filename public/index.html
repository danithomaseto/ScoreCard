<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Card - Painel</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #f2f4f7;
    margin: 0;
    min-height: 100vh;
    padding: 32px 16px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    padding: 28px;
    margin-bottom: 20px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: #667085; font-size: 14px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #344054; }
  select, input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #d0d5dd;
    margin-bottom: 16px;
    font-size: 14px;
  }
  button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #d40511;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button.secondary { background: #667085; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eaecf0; }
  th { color: #667085; font-weight: 600; font-size: 12px; text-transform: uppercase; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.pending { background: #f2f4f7; color: #344054; }
  .badge.running { background: #fff4e5; color: #b54708; }
  .badge.done { background: #ecfdf3; color: #027a48; }
  .badge.failed { background: #fef3f2; color: #b42318; }
  .empty { color: #98a2b3; font-size: 13px; padding: 12px 0; }
  a.download { color: #d40511; font-weight: 600; text-decoration: none; }
  a.download:hover { text-decoration: underline; }
  .msg { font-size: 12px; color: #667085; margin-top: 2px; max-width: 260px; }
  #gate {
    position: fixed; inset: 0; background: rgba(16,24,40,0.6);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  #gate .card { max-width: 360px; width: 100%; margin: 0; }
</style>
</head>
<body>

<div id="gate" hidden>
  <div class="card">
    <h1>Acesso ao painel</h1>
    <p class="subtitle">Informe o token de acesso configurado no Vercel.</p>
    <label for="token-input">Token</label>
    <input id="token-input" type="password" placeholder="Token">
    <button id="token-save">Entrar</button>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <h1>Montagem do Score Card</h1>
    <p class="subtitle">Selecione a operacao e clique em Executar. Um agente local conectado a rede da operacao vai processar a tarefa.</p>

    <label for="operation">Operacao</label>
    <select id="operation"></select>

    <button id="run-btn">Executar</button>
  </div>

  <div class="card">
    <h1 style="font-size:16px;">Historico</h1>
    <table>
      <thead>
        <tr><th>Operacao</th><th>Status</th><th>Atualizado</th><th>Arquivo</th></tr>
      </thead>
      <tbody id="jobs-body"></tbody>
    </table>
    <div id="jobs-empty" class="empty" hidden>Nenhuma tarefa ainda.</div>
  </div>
</div>

<script>
const TOKEN_KEY = 'scorecard_token';
const gate = document.getElementById('gate');
const tokenInput = document.getElementById('token-input');
const tokenSave = document.getElementById('token-save');
const operationSelect = document.getElementById('operation');
const runBtn = document.getElementById('run-btn');
const jobsBody = document.getElementById('jobs-body');
const jobsEmpty = document.getElementById('jobs-empty');

function getToken() {
  return localStorage.getItem(TOKEN_KEY);
}

function showGate() {
  gate.hidden = false;
}

function hideGate() {
  gate.hidden = true;
}

tokenSave.addEventListener('click', () => {
  const value = tokenInput.value.trim();
  if (!value) return;
  localStorage.setItem(TOKEN_KEY, value);
  hideGate();
  bootstrap();
});

async function apiFetch(path, options = {}) {
  const token = getToken();
  const headers = Object.assign({}, options.headers, { Authorization: `Bearer ${token}` });
  const res = await fetch(path, Object.assign({}, options, { headers }));
  if (res.status === 401) {
    localStorage.removeItem(TOKEN_KEY);
    showGate();
    throw new Error('Token invalido.');
  }
  return res;
}

function formatDate(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleString('pt-BR');
}

function renderJobs(jobs) {
  jobsBody.innerHTML = '';
  jobsEmpty.hidden = jobs.length > 0;

  for (const job of jobs) {
    const tr = document.createElement('tr');

    const opTd = document.createElement('td');
    opTd.textContent = job.operationLabel || job.operation;

    const statusTd = document.createElement('td');
    const badge = document.createElement('span');
    badge.className = `badge ${job.status}`;
    badge.textContent = {
      pending: 'Pendente',
      running: 'Executando',
      done: 'Concluido',
      failed: 'Falhou',
    }[job.status] || job.status;
    statusTd.appendChild(badge);
    if (job.message) {
      const msg = document.createElement('div');
      msg.className = 'msg';
      msg.textContent = job.message;
      statusTd.appendChild(msg);
    }

    const dateTd = document.createElement('td');
    dateTd.textContent = formatDate(job.updatedAt || job.createdAt);

    const fileTd = document.createElement('td');
    if (job.status === 'done' && job.fileUrl) {
      const link = document.createElement('a');
      link.className = 'download';
      link.href = job.fileUrl;
      link.textContent = 'Baixar Excel';
      link.target = '_blank';
      link.rel = 'noopener';
      fileTd.appendChild(link);
    } else {
      fileTd.textContent = '-';
    }

    tr.append(opTd, statusTd, dateTd, fileTd);
    jobsBody.appendChild(tr);
  }
}

async function loadOperations() {
  const res = await apiFetch('/api/operations');
  const data = await res.json();
  operationSelect.innerHTML = '';
  for (const op of data.operations) {
    const opt = document.createElement('option');
    opt.value = op.key;
    opt.textContent = op.label;
    operationSelect.appendChild(opt);
  }
}

async function loadJobs() {
  const res = await apiFetch('/api/jobs');
  const data = await res.json();
  renderJobs(data.jobs || []);
}

runBtn.addEventListener('click', async () => {
  runBtn.disabled = true;
  runBtn.textContent = 'Enviando...';
  try {
    await apiFetch('/api/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ operation: operationSelect.value }),
    });
    await loadJobs();
  } catch (err) {
    alert('Erro ao criar tarefa: ' + err.message);
  } finally {
    runBtn.disabled = false;
    runBtn.textContent = 'Executar';
  }
});

async function bootstrap() {
  try {
    await loadOperations();
    await loadJobs();
    setInterval(loadJobs, 4000);
  } catch (err) {
    console.error(err);
  }
}

if (!getToken()) {
  showGate();
} else {
  bootstrap();
}
</script>
</body>
</html>
