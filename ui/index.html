<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Score Card</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-view" class="center-wrap" hidden>
  <div class="card">
    <h2>Score Card</h2>
    <p class="subtitle">Entre com seu usuario e senha do Summary.</p>
    <label for="login-username">Usuario</label>
    <input id="login-username" type="text" autocomplete="username">
    <label for="login-password">Senha</label>
    <input id="login-password" type="password" autocomplete="current-password">
    <button id="login-btn">Entrar</button>
    <div id="login-status" class="status error" hidden></div>
  </div>
</div>

<div id="app-view" hidden>
  <div class="topbar">
    <h1>Score Card</h1>
    <div class="actions">
      <button class="secondary" id="settings-btn">Configuracoes</button>
      <button class="secondary" id="logout-btn">Sair</button>
    </div>
  </div>

  <div class="main-content">
    <div class="card wide">
      <h2>Extrair relatorio</h2>
      <p class="subtitle">Selecione a operacao e clique em Executar.</p>

      <label for="operation">Operacao</label>
      <select id="operation"></select>

      <button id="run-btn">Executar</button>

      <div id="run-status" class="status" hidden></div>
    </div>
  </div>
</div>

<div id="settings-modal" hidden>
  <div class="card">
    <h2>Configuracoes</h2>
    <p class="subtitle">Pasta do SharePoint/OneDrive onde os relatorios sao salvos.</p>
    <div class="folder-box" id="folder-path">Nenhuma pasta selecionada.</div>
    <button id="choose-folder-btn">Alterar pasta</button>
    <button class="secondary" id="close-settings-btn">Fechar</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
